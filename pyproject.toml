[project]
name = "askcontent-platform"
version = "0.1.0"
description = "askcontent — grounded question answering over bounded company content"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "puremagic>=1.28",
    "trafilatura>=1.12",
    "selectolax>=0.3.21",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
# Heavy, lazily imported. Absent installs degrade to a *reported* capability
# gap (CNT-PAR-11), never to a silently worse parse.
pdf = ["pypdfium2>=4.30", "docling>=2.7"]
ocr = ["rapidocr-onnxruntime>=1.3"]
rerank = ["sentence-transformers>=3.2"]
# The answerer. Absent, the console falls back to extractive answers and says
# so. One adapter, every provider: `init_chat_model` resolves the provider at
# runtime, so switching is configuration plus a `pip install`.
langchain = ["langchain>=0.3.14", "langchain-core>=0.3.29"]
langchain-openai = ["langchain>=0.3.14", "langchain-openai>=0.3"]
langchain-anthropic = ["langchain>=0.3.14", "langchain-anthropic>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/askcontent"]

[tool.alembic]
script_location = "migrations"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
