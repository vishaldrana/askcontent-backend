# The control plane's revision history. Separate database, separate tree
# (PLT-TEN-01/02) — see migrations_control/env.py for why this is not tidiness.
#
#   alembic -c alembic_control.ini upgrade head
[alembic]
script_location = migrations_control
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
